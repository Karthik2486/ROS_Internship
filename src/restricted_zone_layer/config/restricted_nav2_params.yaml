# =============================================
#  TurtleBot3 Navigation2 Config with
#  Restricted Zone Layer Integration
# =============================================

amcl:
  ros__parameters:
    use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: /home/karthik/map.yaml

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # Define controller plugin
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: 0.0
      max_vel_x: 0.26
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.82
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2

      vx_samples: 20
      vtheta_samples: 40
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.1
      trans_stopped_velocity: 0.25
      theta_stopped_velocity: 0.25
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    # -------------------------------
    # Local Costmap Configuration
    # -------------------------------
    local_costmap:
      local_costmap:
        ros__parameters:
          update_frequency: 5.0
          publish_frequency: 2.0
          global_frame: odom
          robot_base_frame: base_link
          rolling_window: true
          width: 5.0
          height: 5.0
          resolution: 0.05
          robot_radius: 0.1

          plugins: ["obstacle_layer", "inflation_layer", "restricted_zone_layer"]

          obstacle_layer:
            plugin: "nav2_costmap_2d::ObstacleLayer"
            enabled: true
            observation_sources: scan
            scan:
              topic: /scan
              max_obstacle_height: 2.0
              clearing: true
              marking: true
              data_type: LaserScan

          inflation_layer:
            plugin: "nav2_costmap_2d::InflationLayer"
            enabled: true
            inflation_radius: 0.5
            cost_scaling_factor: 5.0

          restricted_zone_layer:
            plugin: "restricted_zone_layer_ns::RestrictedZoneLayer"
            enabled: true
            lethal_cost: 254
            zone_topic: "/restricted_zone/polygons"

# -------------------------------
# Global Costmap Configuration
# -------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      robot_radius: 0.1
      resolution: 0.05
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "restricted_zone_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.5
        cost_scaling_factor: 5.0

      restricted_zone_layer:
        plugin: "restricted_zone_layer_ns::RestrictedZoneLayer"
        enabled: true
        lethal_cost: 254
        zone_topic: "/restricted_zone/polygons"

# -------------------------------
# Behavior Tree Navigator
# -------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: True
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

# -------------------------------
# Lifecycle Managers
# -------------------------------
lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names:
      - map_server
      - amcl
      - controller_server
      - planner_server
      - bt_navigator
      - lifecycle_manager

