slam_toolbox:
  ros__parameters:
    # Use 'true' for Gazebo/RViz simulation; set to false on the real robot
    use_sim_time: true

    # Frames and topics (match your robot/sim)
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint   # use base_link on many real robots
    scan_topic: /scan

    # Run in mapping mode (build a map); for pure localization later use 'localization'
    mode: mapping

    # Useful defaults
    resolution: 0.05
    max_laser_range: 12.0
    minimum_laser_range: 0.05
    transform_publish_period: 0.02
    map_update_interval: 1.0
    publish_period: 1.0

    # Lets you click-adjust in RViz
    enable_interactive_mode: true
